# Supabase port blocks for projects whose local stack runs on porg.
#
# Format:  <project-name> <base-port>
#
# Each project owns a block of 10 ports, base..base+9, matching the layout the
# Supabase CLI uses (base+0 shadow db, +1 api, +2 db, +3 studio, +4 mailpit,
# +7 analytics, +9 pooler). The tunnel forwards the whole block so every URL
# stays 127.0.0.1 on this machine, exactly as it was with local Docker.
#
# 54320 is the Supabase default block, so the project that keeps the defaults
# needs no config.toml changes at all. Every other project must set its ports
# explicitly in supabase/config.toml (see porg/README.md).
#
# Add a line here, then: porg-tunnel restart

linkintel    54320
mentiondrop  54330
